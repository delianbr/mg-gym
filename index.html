<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MG Gym">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>MG Gym</title>
<style>
/* iPhone system fonts (SF Pro / SF Pro Rounded) so it reads as a native app and works offline */
:root{
  --bg:#f2f2f7;--card:#fff;--fill:#e9e9ee;--ink:#111114;--muted:#86868f;--line:rgba(60,60,67,.13);
  --v:#ff5a6e;--d:#3d8bff;--both:#9b6bff;--v-soft:#ffe8eb;--d-soft:#e3eeff;--both-soft:#efe8ff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",monospace;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --sk:#56575d;--sk2:#bdbec3;--paper:#fafafa;--red:#ff5a6e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--fill:#2c2c2e;--ink:#f5f5f7;--muted:#98989f;--line:rgba(255,255,255,.1);
  --v-soft:#3a1a20;--d-soft:#13243f;--both-soft:#261b3d;--shadow:none;
  --sk:#cfd0d5;--sk2:#4c4d53;--paper:#232325;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--text);min-height:100dvh;overscroll-behavior-y:none}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc,var(--d));outline-offset:2px}

/* each person keeps their colour everywhere: coral Vicky, blue Delian, violet when it's a shared session */
.pv{--acc:var(--v);--acc-soft:var(--v-soft)}.pd{--acc:var(--d);--acc-soft:var(--d-soft)}.pb{--acc:var(--both);--acc-soft:var(--both-soft)}

.view{padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px);max-width:560px;margin:0 auto;display:grid;gap:18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.eyebrow{font:600 .78rem/1.2 var(--text);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.title{font:800 2.1rem/1.05 var(--round);letter-spacing:-.02em}
.avatar{display:inline-block;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;font:700 1rem/38px var(--round);text-align:center;flex:none}
.section{font:700 1.25rem/1.2 var(--round);letter-spacing:-.01em}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)}
.small{font-size:.86rem}

.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;background:var(--acc);display:grid;gap:14px;min-height:220px;align-content:end;isolation:isolate}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:saturate(.8)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.25) 40%,color-mix(in srgb,var(--acc) 82%,#000) 100%)}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.hero h2{font:800 2rem/1.05 var(--round);letter-spacing:-.02em}
.hero .meta{font-size:.92rem;opacity:.92}
.hero .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.hero.rest{background:var(--card);color:var(--ink);min-height:0}
.hero.rest::before{display:none}
.hero.rest .eyebrow{color:var(--muted)}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font:700 1.08rem/1 var(--round);background:#fff;color:color-mix(in srgb,var(--acc) 85%,#000)}
.big.solid{background:var(--acc);color:#fff}
.big.soft{background:var(--fill);color:var(--ink)}

.partner{display:flex;align-items:center;gap:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none}
.partner .avatar{width:34px;height:34px;line-height:34px;font-size:.9rem}
.partner div{display:grid;gap:1px;min-width:0}
.partner b{font-weight:600}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.strip span{font:600 .72rem/1 var(--text);color:var(--muted)}
.strip i{display:grid;place-items:center;margin:6px auto 0;width:34px;height:34px;border-radius:50%;background:var(--fill);font:700 .85rem/1 var(--round);font-style:normal;color:var(--muted);position:relative}
.strip i.done{background:var(--acc);color:#fff}
.strip i.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.strip i.mate::after{content:"";position:absolute;bottom:-7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--mate)}

.phase{display:grid;gap:10px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps4 i{height:5px;border-radius:9px;background:var(--fill)}
.steps4 i.on{background:var(--acc)}
.phase h3{font:700 1.05rem/1.2 var(--round)}

.list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;border-top:1px solid var(--line);text-decoration:none}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0;display:grid;gap:2px}
.row .grow b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);font-size:1.2rem}
.tag{font:700 .7rem/1 var(--text);padding:5px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;padding:8px 8px calc(var(--safe-b) + 6px);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--line)}
.tabbar button{display:grid;justify-items:center;gap:3px;font:600 .68rem/1 var(--text);color:var(--muted);padding:4px 18px}
.tabbar button[aria-current="page"]{color:var(--acc)}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:3px}
.seg button{padding:9px;border-radius:10px;font:600 .92rem/1 var(--text);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.stats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none;min-width:120px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;gap:4px}
.stat b{font:800 1.35rem/1.1 var(--round);letter-spacing:-.01em}

details.day{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
details.day>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary .chev{transition:transform .2s}
details.day[open]>summary .chev{transform:rotate(90deg)}
.wkday{width:48px;height:48px;border-radius:14px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font:800 .82rem/1 var(--round);flex:none;text-transform:uppercase}
.exrow{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.exrow img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--fill)}
.exrow b{font-weight:600}
.load{font:500 .8rem/1.3 var(--mono);color:var(--muted)}

.how{margin-top:8px}
.how summary{cursor:pointer;font:600 .86rem/1 var(--text);color:var(--acc);list-style:none}
.how summary::-webkit-details-marker{display:none}
.how .in{display:grid;gap:10px;margin-top:10px;font-size:.9rem}
.how ul{margin:0;padding-left:18px;display:grid;gap:4px}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{font:600 .8rem/1 var(--text);text-decoration:none;background:var(--fill);border-radius:99px;padding:8px 12px}
.sk{width:100%;max-width:240px;aspect-ratio:4/3;background:var(--paper);border-radius:14px}
.sk .bd{fill:none;stroke:var(--sk);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sk .bd2{fill:none;stroke:var(--sk2);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.sk .hd{fill:var(--paper);stroke:var(--sk);stroke-width:2.2}
.sk .pr{fill:none;stroke:var(--sk2);stroke-width:1.6;stroke-linecap:round}
.sk .cb{stroke:var(--sk2);stroke-width:1;stroke-dasharray:2 3}
.sk .fl{stroke:var(--sk2);stroke-width:1;stroke-dasharray:1 4}
.sk .gd{fill:none;stroke:var(--sk);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.sk .mu{fill:var(--red);fill-opacity:.2;stroke:var(--red);stroke-width:1;stroke-dasharray:2 2}
.sk .ar{fill:none;stroke:var(--red);stroke-width:1.8;stroke-linecap:round}

.weekhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weekhead button.circle{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font:600 1.1rem/1 var(--text)}
.dayrow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.dayrow:first-child{border-top:0}
.dayrow .d{display:grid;justify-items:center;font:600 .72rem/1.1 var(--text);color:var(--muted)}
.dayrow .d b{font:800 1.3rem/1 var(--round);color:var(--ink)}
.dayrow.now .d b{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:12px;background:var(--acc-soft);font:600 .84rem/1 var(--text)}
.chip small{font:700 .78rem/1 var(--round);color:var(--acc)}

/* workout mode is a full-screen sheet so the tab bar and everything else get out of the way at the gym */
.workout{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.wtop{position:sticky;top:0;z-index:2;display:grid;gap:10px;padding:calc(var(--safe-t) + 8px) 16px 10px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.wtop .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wtop h1{font:700 1rem/1.2 var(--round);text-align:center;flex:1}
.icon.confirm{width:auto;padding:0 12px;border-radius:99px;color:var(--v);font-size:.8rem}
.icon{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font:600 1.05rem/1 var(--text)}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:4px;border-radius:9px;background:var(--fill)}
.segs i.done{background:var(--acc)}
.segs i.here{background:color-mix(in srgb,var(--acc) 45%,var(--fill))}
.wbody{max-width:560px;margin:0 auto;padding:6px 16px calc(var(--safe-b) + 170px);display:grid;gap:16px}
.photo{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:2/1;background:var(--fill)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo span{position:absolute;left:12px;bottom:12px;font:600 .76rem/1 var(--text);color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 10px;border-radius:99px}
.exname{font:800 1.7rem/1.1 var(--round);letter-spacing:-.02em}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.specs div{background:var(--card);border-radius:16px;padding:12px 14px;display:grid;gap:3px;box-shadow:var(--shadow)}
.specs b{font:700 1.08rem/1.15 var(--round)}
.specs span{font-size:.76rem;color:var(--muted)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.set{aspect-ratio:1;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-content:center;justify-items:center;gap:2px;transition:transform .12s}
.set b{font:800 1.5rem/1 var(--round)}
.set span{font:600 .68rem/1 var(--text);color:var(--muted)}
.set:active{transform:scale(.94)}
.set.on{background:var(--acc);box-shadow:none;color:#fff}
.set.on span{color:rgba(255,255,255,.85)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt a{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-decoration:none}
.play{width:36px;height:36px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none;font-size:.8rem}
.opt .grow{display:grid;gap:2px;min-width:0}
.tick{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none;font-weight:800;color:transparent}
.tick.on{background:var(--acc);box-shadow:none;color:#fff}
.stepnav{position:fixed;left:0;right:0;bottom:0;z-index:31;display:flex;gap:10px;padding:12px 16px calc(var(--safe-b) + 12px);background:linear-gradient(transparent,var(--bg) 30%)}
.stepnav .big{flex:1}
.stepnav .icon{width:54px;height:54px;border-radius:16px;font-size:1.3rem}
.timer{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 84px);z-index:32;max-width:528px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:20px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.timer svg{width:40px;height:40px;transform:rotate(-90deg);flex:none}
.timer circle{fill:none;stroke-width:4}
.timer .grow{flex:1;display:grid;gap:1px}
.timer b{font:800 1.4rem/1 var(--round);font-variant-numeric:tabular-nums}
.timer span{font-size:.76rem;opacity:.7}
.timer button{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bg) 16%,transparent);font:700 .84rem/1 var(--text)}
.timer.go{background:var(--acc);color:#fff}
.finish{text-align:center;display:grid;gap:12px;justify-items:center;padding-top:30px}
.finish .badge{width:96px;height:96px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:2.8rem}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:grid;align-items:end}
.sheet>div{background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(var(--safe-b) + 20px);display:grid;gap:14px;max-height:85dvh;overflow:auto}
.grab{width:38px;height:5px;border-radius:9px;background:var(--fill);margin:0 auto}
.sheet input[type=date]{font:600 1rem var(--text);padding:12px;border-radius:12px;border:0;background:var(--card);color:var(--ink);width:100%}

.banner{display:flex;gap:12px;align-items:center;background:var(--acc-soft);border-radius:18px;padding:12px 14px;font-size:.88rem}
.banner b{display:block}
.status{background:var(--fill);border-radius:14px;padding:10px 14px;font-size:.86rem}

.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px 20px}
.gate form,.gate .who{width:100%;max-width:380px;display:grid;gap:12px}
.gate img{width:76px;height:76px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:6px}
.gate h1{font:800 2rem/1.05 var(--round);letter-spacing:-.02em}
.gate input{font:500 1.05rem var(--text);padding:15px 14px;border:0;border-radius:14px;background:var(--card);color:var(--ink);width:100%;box-shadow:var(--shadow)}
.gate .err{color:var(--v);font-size:.88rem}
.gate .pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gate .pick button{border-radius:20px;padding:22px 10px;background:var(--acc);color:#fff;font:800 1.2rem/1 var(--round);display:grid;justify-items:center;gap:10px}
.gate .pick .avatar{background:rgba(255,255,255,.25);width:52px;height:52px;line-height:52px;font-size:1.4rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="pd">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--red)"/></marker></defs></svg>

<div class="gate" id="gate" hidden>
 <form id="gate-form" novalidate>
  <img src="icon-180.png" alt="">
  <h1>MG Gym</h1>
  <p class="muted" id="gate-msg">Your shared plan for Moderncoach Deggendorf.</p>
  <div class="seg" role="group" aria-label="Sign in or create account">
   <button type="button" data-mode="email" aria-pressed="true">Sign in</button>
   <button type="button" data-mode="signup" aria-pressed="false">Create account</button>
  </div>
  <input type="email" id="gate-email" placeholder="Email" autocomplete="email" inputmode="email">
  <input type="password" id="gate-pass" placeholder="Password" autocomplete="current-password">
  <button class="big solid" id="gate-btn" type="submit">Sign in</button>
  <p class="err" id="gate-err" hidden></p>
 </form>
 <div class="who" id="who" hidden>
  <img src="icon-180.png" alt="">
  <h1>Whose phone is this?</h1>
  <p class="muted">The app opens on your own plan and colour from now on.</p>
  <div class="pick"><button class="pv" data-me="v"><span class="avatar">V</span>Vicky</button><button class="pd" data-me="d"><span class="avatar">D</span>Delian</button></div>
 </div>
</div>

<main id="app"></main>
<div id="layer"></div>

<nav class="tabbar" aria-label="Sections">
 <button data-view="today" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.2 1.5 1 2.5 2 3 0-3 0-6 1-8.5z"/></svg>Today</button>
 <button data-view="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week</button>
 <button data-view="plan"><svg viewBox="0 0 24 24"><path d="M2.5 9.5v5M5.5 7v10M18.5 7v10M21.5 9.5v5M5.5 12h13"/></svg>Plan</button>
</nav>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
const IMG={cable:'img/cable.jpg',cables:'img/cables2.jpg',cablebench:'img/cablebench.jpg',plate:'img/plate.jpg',plate2:'img/plate2.jpg',row:'img/platerow.jpg',leg:'img/legpress.jpg',racks:'img/racks.jpg',turf:'img/turf.jpg',bench:'img/benches.jpg',db:'img/dumbbells.jpg',dbarea:'img/dbarea.jpg',cardio:'img/cardio.jpg'}
const WHERE={cable:'Cable towers',cables:'Cable stations',cablebench:'Cable station + bench',plate:'Plate-loaded machines',plate2:'Machine floor',row:'Plate-loaded row, window side',leg:'Leg machines by the corridor',racks:'Power racks',turf:'Turf lane + racks',bench:'Adjustable benches',db:'Dumbbell rack',dbarea:'Dumbbell area + mirrors',cardio:'Cardio floor'}
const MS='https://www.muscleandstrength.com/exercises/'
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q)
const DEMO={
 pulldown:[['Video guide',MS+'lat-pull-down.html']],
 platerow:[['Video guide',MS+'seated-row.html'],['Plate-loaded version',yt('plate loaded seated row machine form')]],
 dbrow:[['Video guide',MS+'one-arm-dumbbell-row.html']],
 facepull:[['Video guide',MS+'cable-face-pull']],
 reardelt:[['Video guide',MS+'bent-over-rear-delt-fly-head-on-bench']],
 hammer:[['Video',yt('dumbbell hammer curl proper form')]],
 deadbug:[['Video guide',MS+'dead-bug']],
 abdlean:[['Video (PT)',yt('cadeira abdutora tronco inclinado')]],
 hipthrust:[['Video guide',MS+'barbell-hip-thrust'],['Video (PT)',yt('elevação pélvica barra livre')]],

function sketch(k){

 const pl=a=>'M'+a.slice(0,2)+'L'+a.slice(2).reduce((o,v,i)=>o+(i%2?','+v:(i?' ':'')+v),'')

 return `<svg class="sk" viewBox="0 0 200 150" role="img" aria-label="Sketch of the movement"><path d="${FL}" class="fl"/>${s.p}
 ${s.g.map(g=>`<path d="${pl(g)}" class="gd"/>`).join('')}
 ${s.m.map(([x,y,rx,ry])=>`<ellipse cx="${x}" cy="${y}" rx="${rx+2}" ry="${ry+2}" class="mu"/>`).join('')}
 ${s.b.map(b=>`<path d="${pl(j(b))}" class="bd2"/><path d="${pl(b)}" class="bd"/>`).join('')}
 <circle cx="${s.h[0]}" cy="${s.h[1]}" r="8" class="hd"/><circle cx="${s.h[0]+.8}" cy="${s.h[1]+.6}" r="8.4" class="bd2" fill="none"/>
 ${s.a.map(a=>`<path d="${pl(a)}" class="ar" marker-end="url(#ah)"/>`).join('')}</svg>`
}


// Program ids stay the same as before, so check-ins already saved in Supabase still match their programs
const programId=title=>/glute/i.test(title)?'glutes':/chest/i.test(title)?'chestback':/ham/i.test(title)?'hams':/arm/i.test(title)?'arms':'legs'
const PROGRAMS={v:PLAN.v.days.map(x=>({...x,id:programId(x.t)})),d:PLAN.d.days.map(x=>({...x,id:programId(x.t)}))}
const NAME={v:'Vicky',d:'Delian'}
const PARTNER={v:'d',d:'v'}
const PROGRAM_NAME={glutes:'Glutes',chestback:'Chest & back',hams:'Hamstrings & lower back',arms:'Arms & shoulders',legs:'Legs & abs'}
const WEEKDAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
// what each of you should do on a day off, taken from your own plan rules
const REST_TIP={v:'Get your 8–10k steps in and keep the calorie deficit.',d:'Eat the surplus today too: 3 meals and 2 snacks, 100–110 g protein.'}

const pad=n=>String(n).padStart(2,'0')
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
const atNoon=s=>new Date(s+'T12:00')
const mondayOf=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const shortDate=s=>atNoon(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})
const $=id=>document.getElementById(id)
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}}

let today=iso(new Date())
let me=store.get('who'),view='today',planFor=null,weekStart=mondayOf(new Date())
let checkins={},sb=null,syncNote='',confirmRemove=false
let workout=null   // {key, step}; step 0 = warm-up, 1..n = exercises, n+1 = recovery, n+2 = finished
let rest=null      // {ends, total}

const totalRounds=program=>program.ex.reduce((sum,e)=>sum+e[4],0)
const roundsDone=c=>Object.keys(c?.rounds||{}).length
const programOf=c=>PROGRAMS[c.person].find(p=>p.id===c.program)
const checkinsOf=(person,date)=>Object.values(checkins).filter(c=>c.person===person&&(!date||c.date===date))
const scheduledOn=(person,date)=>PROGRAMS[person].find(p=>p.d===WEEKDAY[atNoon(date).getDay()])
const accentClass=(program,person)=>program?.both?'pb':'p'+person

// the 8-week block starts at each person's first check-in, like the original plan says
function programWeek(person){
 const first=checkinsOf(person).map(c=>c.date).sort()[0]
 if(!first)return 1
 return Math.min(8,Math.floor((mondayOf(atNoon(today))-mondayOf(atNoon(first)))/6048e5)+1)
}
const sentence=t=>t.charAt(0).toUpperCase()+t.slice(1)
const phaseIndex=week=>week<=2?0:week<=6?1:week===7?2:3

// rest values in the plan read like "90 s", "1–2 min" or "2–3 min"; the timer uses the lower bound so nobody waits longer than planned
function restSeconds(text){const n=parseFloat(text);return /min/.test(text)?n*60:n}

const row=c=>({key:c.key,date:c.date,person:c.person,program:c.program,rounds:c.rounds||{},warm:c.warm||null,cool:c.cool||null,at:c.at||new Date().toISOString()})
async function save(c){
 checkins[c.key]=c;render()
 if(!sb)return
 const {error}=await sb.from('checkins').upsert(row(c))
 if(error){syncNote='That change didn\'t reach the server. It\'s kept on this phone; check your connection.';render()}
}
async function remove(key){
 delete checkins[key];closeWorkout()
 if(!sb)return
 const {error}=await sb.from('checkins').delete().eq('key',key)
 if(error){syncNote='Couldn\'t remove that check-in from the server. Try again with a connection.';render()}
}
function startWorkout(person,programIdToStart,date=today){
 const key=`${date}_${person}_${programIdToStart}`
 if(!checkins[key])save({key,date,person,program:programIdToStart,rounds:{},warm:null,cool:null,at:new Date().toISOString()})
 openWorkout(key)
}
function openWorkout(key,step){
 const c=checkins[key],program=programOf(c)
 // reopening jumps to the first exercise with unticked sets, so a paused session picks up where it stopped
 const resume=c.warm?1+Math.max(0,program.ex.findIndex((e,ei)=>[...Array(e[4])].some((_,ri)=>!c.rounds?.[`${ei}-${ri}`]))):0
 workout={key,step:step??(roundsDone(c)===totalRounds(program)?program.ex.length+1:resume)}
 store.set('workout',JSON.stringify(workout));confirmRemove=false;keepAwake(true);render()
}
function closeWorkout(){workout=null;rest=null;store.set('workout',null);keepAwake(false);render()}

let wakeLock=null
async function keepAwake(on){
 try{if(on&&!wakeLock&&navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen');if(!on&&wakeLock){wakeLock.release();wakeLock=null}}catch(e){wakeLock=null}
}

let tick=null
function startRest(seconds){rest={ends:Date.now()+seconds*1000,total:seconds};runTimer()}
// the "Go" state stays up for a few seconds after the rest ends, then the bar tucks itself away
function runTimer(){
 clearInterval(tick);drawTimer()
 tick=setInterval(()=>{if(rest&&Date.now()>rest.ends+5000)rest=null;drawTimer();if(!rest)clearInterval(tick)},250)
}
function drawTimer(){
 const el=$('timer');if(!el)return
 if(!rest){el.hidden=true;return}
 const left=Math.max(0,Math.ceil((rest.ends-Date.now())/1000)),done=left===0
 if(done&&!rest.buzzed){rest.buzzed=true;navigator.vibrate?.([120,60,120])}
 const r=16,len=2*Math.PI*r,frac=done?1:1-left/rest.total
 el.hidden=false;el.className='timer'+(done?' go':'')
 el.innerHTML=`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="${r}" stroke="currentColor" stroke-opacity=".2"/><circle cx="20" cy="20" r="${r}" stroke="currentColor" stroke-dasharray="${len}" stroke-dashoffset="${len*(1-frac)}" stroke-linecap="round"/></svg>
 <div class="grow"><b>${done?'Go':Math.floor(left/60)+':'+pad(left%60)}</b><span>${done?'Next set when you\'re ready':'Rest'}</span></div>
 ${done?'':'<button data-rest="+15">+15 s</button>'}<button data-rest="skip">${done?'OK':'Skip'}</button>`
}

const avatar=p=>`<span class="avatar p${p}">${NAME[p][0]}</span>`

function partnerLine(program){
 const mate=PARTNER[me],theirs=checkinsOf(mate,today)[0],theirProgram=theirs?programOf(theirs):scheduledOn(mate,today)
 let text
 if(theirs)text=roundsDone(theirs)===totalRounds(theirProgram)?`Finished ${PROGRAM_NAME[theirs.program].toLowerCase()} ✓`:`${PROGRAM_NAME[theirs.program]} · ${roundsDone(theirs)} of ${totalRounds(theirProgram)} sets`
 else if(theirProgram)text=theirProgram.id===program?.id?'Hasn\'t started yet':`Planned: ${PROGRAM_NAME[theirProgram.id].toLowerCase()}`
 else text='Rest day'
 return `<div class="card partner p${mate}">${avatar(mate)}<div><b>${NAME[mate]}</b><span class="muted small">${text}</span></div></div>`
}

function weekStrip(person){
 const monday=mondayOf(atNoon(today)),mate=PARTNER[person]
 return `<div class="card strip p${person}" style="--mate:var(--${mate})">${[...Array(7)].map((_,i)=>{
  const d=new Date(monday);d.setDate(d.getDate()+i);const s=iso(d)
  const cls=[checkinsOf(person,s).length&&'done',s===today&&'today',checkinsOf(mate,s).length&&'mate'].filter(Boolean).join(' ')
  return `<div><span>${'MTWTFSS'[i]}</span><i class="${cls}">${d.getDate()}</i></div>`}).join('')}</div>`
}

function nextScheduled(person){
 for(let i=1;i<=7;i++){const d=atNoon(today);d.setDate(d.getDate()+i);const p=scheduledOn(person,iso(d));if(p)return [WEEKDAY[d.getDay()],p]}
}

function installBanner(){
 const iphone=/iPhone|iPad/.test(navigator.userAgent),installed=navigator.standalone||matchMedia('(display-mode: standalone)').matches
 if(!iphone||installed||store.get('hideInstall'))return ''
 return `<div class="banner"><div style="flex:1"><b>Put MG Gym on your Home Screen</b>Tap <b style="display:inline">Share ⬆︎</b>, then <b style="display:inline">Add to Home Screen</b>. It opens full-screen like any app.</div><button class="icon" data-act="hide-install" aria-label="Hide">✕</button></div>`
}

function renderToday(){
 const program=scheduledOn(me,today),mine=checkinsOf(me,today),started=mine.find(c=>c.program===program?.id)||mine[0]
 const shown=started?programOf(started):program,week=programWeek(me),phase=PLAN[me].phases[phaseIndex(week)]
 const [phaseLabel,...phaseText]=phase.split(': ')
 let hero
 if(shown){
  const total=totalRounds(shown),done=started?roundsDone(started):0,finished=started&&done===total
  const label=finished?'Done · view session':started?'Continue workout':'Start workout'
  hero=`<section class="hero ${accentClass(shown,me)}"><img src="${IMG[shown.ex[0][2]]}" alt="">
   <p class="eyebrow">${started&&started.program!==program?.id?'Extra session':'Today'} · ${shown.both?`with ${NAME[PARTNER[me]]}`:'solo'}</p>
   <h2>${shown.t}</h2>
   <p class="meta">${shown.ex.length} exercises · ${total} sets · ${shown.s.split('· ').pop()}</p>
   ${started?`<div class="bar"><i style="width:${done/total*100}%"></i></div><p class="meta">${done} of ${total} sets done</p>`:''}
   <button class="big" ${started?`data-open="${started.key}"`:`data-start="${shown.id}"`}>${label}</button></section>`
 }else{
  const next=nextScheduled(me)
  hero=`<section class="hero rest p${me}"><p class="eyebrow">Today</p><h2>Rest day</h2><p class="meta muted">${REST_TIP[me]}</p>${next?`<p class="meta muted">Next: <b style="color:var(--ink)">${next[0]} · ${next[1].t}</b></p>`:''}</section>`
 }
 return `<div class="view p${me}">
  <header class="top"><div><p class="eyebrow">${atNoon(today).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p><h1 class="title">Today</h1></div><button data-view="plan" aria-label="Your plan">${avatar(me)}</button></header>
  ${installBanner()}
  ${syncNote?`<p class="status">${syncNote}</p>`:''}
  ${hero}
  ${partnerLine(shown)}
  <h2 class="section">This week</h2>
  ${weekStrip(me)}
  <section class="card phase"><div class="steps4">${[0,1,2,3].map(i=>`<i class="${i<=phaseIndex(week)?'on':''}"></i>`).join('')}</div><p class="eyebrow">Week ${week} of 8 · ${phaseLabel}</p><h3>${sentence(phaseText.join(': '))}</h3></section>
  <button class="big soft" data-act="other">Log a different workout</button>
 </div>`
}

 const who=planFor||me,P=PLAN[who],week=programWeek(who),mine=checkinsOf(who)
 return `<div class="view p${who}">
  <header class="top"><div><p class="eyebrow">8-week program</p><h1 class="title">Plan</h1></div>${avatar(who)}</header>
  <div class="seg" role="group" aria-label="Whose plan">${['v','d'].map(p=>`<button class="p${p}" data-plan="${p}" aria-pressed="${p===who}">${NAME[p]}${p===me?' (you)':''}</button>`).join('')}</div>
  <div class="stats">${P.goal.map(([label,value])=>`<div class="stat"><span class="eyebrow">${label}</span><b>${value}</b></div>`).join('')}
   <div class="stat"><span class="eyebrow">Program week</span><b>${week} of 8</b></div><div class="stat"><span class="eyebrow">Sessions logged</span><b>${mine.length}</b></div></div>
  <section class="card phase"><div class="steps4">${[0,1,2,3].map(i=>`<i class="${i<=phaseIndex(week)?'on':''}"></i>`).join('')}</div>
   ${P.phases.map((x,i)=>{const [l,...t]=x.split(': ');return `<p class="small${i===phaseIndex(week)?'':' muted'}"><b>${l}.</b> ${sentence(t.join(': '))}</p>`}).join('')}</section>
  <h2 class="section">Training days</h2>
  ${PROGRAMS[who].map(p=>`<details class="day ${accentClass(p,who)}"><summary><span class="wkday">${p.d.slice(0,3)}</span><span class="grow" style="flex:1;display:grid;gap:2px"><b>${p.t}</b><span class="muted small">${p.ex.length} exercises · ${p.s.split('· ').pop()}</span></span>${p.both?'<span class="tag">Together</span>':''}<span class="chev">›</span></summary>
   ${p.ex.map(([name,cue,img,key,rounds,reps,restText,start,goal])=>`<div class="exrow"><img src="${IMG[img]}" alt="" loading="lazy"><div><b>${name}</b><p class="muted small">${cue}</p><p class="load">${rounds} × ${reps} · rest ${restText}<br>${start} → ${goal}</p>${howTo(key)}</div></div>`).join('')}
   <div style="padding:12px 16px 16px"><button class="big solid" data-start="${p.id}" data-for="${who}">Start ${p.t.toLowerCase()} now</button></div></details>`).join('')}
  <section class="card"><h3 class="section" style="margin-bottom:8px">Rules for ${NAME[who]}</h3><ul style="margin:0;padding-left:18px;display:grid;gap:6px">${P.notes.map(n=>`<li>${n}</li>`).join('')}</ul></section>
  <div class="list">
   <button class="row" data-act="share"><span class="grow"><b>Share the app</b><span class="muted small">Send the link to ${NAME[PARTNER[me]]}</span></span><span class="chev">›</span></button>
   <button class="row" data-act="switch"><span class="grow"><b>This phone is ${NAME[me]}'s</b><span class="muted small">Tap to change</span></span><span class="chev">›</span></button>
   <button class="row" data-act="signout"><span class="grow"><b style="color:var(--v)">Sign out</b></span></button>
  </div>
  <p class="muted small">Weights are starting estimates: pick the load where the last 2 reps are hard but clean. Plate-loaded numbers are per side unless marked total. Photos: moderncoachgym.de.</p>
 </div>`
}

function workoutStep(c,program,step){
 const n=program.ex.length
 if(step===0){
  const list=program.both?WARM_DUO:WARM_SOLO
  return `<p class="eyebrow">Step 1 · 10 min</p><h2 class="exname">${program.both?'Warm-up':'Pilates warm-up'}</h2><p class="muted">Pick one video, follow along, then tick it.</p>
   ${videoList(list,c,'warm')}
   ${program.both?`<h3 class="section">Posture block</h3><div class="list">${POSTURE.map(([name,dose,url])=>`<a class="row" href="${url}" target="_blank" rel="noopener"><span class="play">▶</span><span class="grow"><b>${name}</b><span class="muted small">${dose}</span></span><span class="chev">›</span></a>`).join('')}</div>`:''}`
 }
 if(step===n+1)return `<p class="eyebrow">Last step · 10 min</p><h2 class="exname">Recovery</h2><p class="muted">Stretch it out before you leave.</p>${videoList(COOL,c,'cool')}`
 if(step===n+2){
  const done=roundsDone(c),total=totalRounds(program)
  return `<div class="finish"><span class="badge">✓</span><h2 class="exname">${done===total?'Session complete':'Session saved'}</h2><p class="muted">${done} of ${total} sets · warm-up ${c.warm?'✓':'skipped'} · recovery ${c.cool?'✓':'skipped'}</p><p class="muted small">${NAME[c.person]} has trained ${checkinsOf(c.person).filter(x=>x.date>=iso(mondayOf(atNoon(today)))).length} days this week.</p></div>`
 }
 const ei=step-1,[name,cue,img,key,rounds,reps,restText,start,goal]=program.ex[ei]
 return `<div class="photo"><img src="${IMG[img]}" alt="${WHERE[img]} at Moderncoach Deggendorf"><span>📍 ${WHERE[img]}</span></div>
  <div><p class="eyebrow">Exercise ${step} of ${n}</p><h2 class="exname">${name}</h2><p class="muted" style="margin-top:4px">${cue}</p></div>
  <div class="sets">${[...Array(rounds)].map((_,ri)=>{const k=`${ei}-${ri}`;return `<button class="set${c.rounds?.[k]?' on':''}" data-set="${k}" data-rest="${restSeconds(restText)}" aria-pressed="${!!c.rounds?.[k]}"><b>${ri+1}</b><span>${c.rounds?.[k]?'done':reps}</span></button>`}).join('')}</div>
  <div class="specs"><div><b>${start}</b><span>start weight</span></div><div><b>${goal}</b><span>week 8 goal</span></div><div><b>${rounds} × ${reps}</b><span>sets × reps</span></div><div><b>${restText}</b><span>rest between sets</span></div></div>
  ${howTo(key)}`
}

function videoList(list,c,field){
 return `<div class="list">${list.map(([id,title,url])=>{const used=checkinsOf(c.person).filter(x=>x[field]===id).length
  return `<div class="opt"><a href="${url}" target="_blank" rel="noopener"><span class="play">▶</span><span class="grow"><b>${title}</b><span class="muted small">${used?`Done ${used}× before`:'New'}</span></span></a><button class="tick${c[field]===id?' on':''}" data-pick="${field}" data-id="${id}" aria-label="Mark done" aria-pressed="${c[field]===id}">✓</button></div>`}).join('')}</div>`
}

function renderWorkout(){
 if(!workout||!checkins[workout.key])return ''
 const c=checkins[workout.key],program=programOf(c),n=program.ex.length,step=workout.step
 const exDone=ei=>[...Array(program.ex[ei][4])].every((_,ri)=>c.rounds?.[`${ei}-${ri}`])
 const segs=[c.warm,...program.ex.map((_,ei)=>exDone(ei)),c.cool]
 const nextLabel=step===n+2?'Back to today':step===n+1?'Finish':step===0?'Start exercises':step===n?'Recovery':'Next exercise'
 return `<div class="workout ${accentClass(program,c.person)}">
  <div class="wtop"><div class="bar"><button class="icon" data-act="close" aria-label="Close">✕</button><h1>${program.t}${c.person!==me?` · ${NAME[c.person]}`:''}${c.date!==today?` · ${shortDate(c.date)}`:''}</h1><button class="icon${confirmRemove?' confirm':''}" data-act="remove" aria-label="Remove check-in">${confirmRemove?'Remove?':'⋯'}</button></div>
   <div class="segs">${segs.map((done,i)=>`<i class="${done?'done':i===Math.min(step,n+1)?'here':''}"></i>`).join('')}</div></div>
  <div class="wbody">${workoutStep(c,program,step)}</div>
  <div class="timer" id="timer" hidden></div>
  <nav class="stepnav">${step>0?'<button class="icon" data-step="-1" aria-label="Previous">‹</button>':''}<button class="big solid" data-step="${step===n+2?'done':1}">${nextLabel}</button></nav>
 </div>`
}

function renderSheet(){
 if(!sheetOpen)return ''
 return `<div class="sheet" data-act="sheet-bg"><div class="p${me}"><span class="grab"></span><h2 class="section">Log a workout</h2>
  <label class="small muted">Day<input type="date" id="other-date" value="${sheetDate}" max="${today}"></label>
  <div class="list">${PROGRAMS[me].map(p=>`<button class="row ${accentClass(p,me)}" data-start="${p.id}" data-pick-date><span class="wkday">${p.d.slice(0,3)}</span><span class="grow"><b>${p.t}</b><span class="muted small">${p.ex.length} exercises</span></span><span class="chev">›</span></button>`).join('')}</div></div></div>`
}
let sheetOpen=false,sheetDate=today

function render(){
 today=iso(new Date())
 if(!me)return
 document.body.className='p'+me
 const scroll=view==='today'?renderToday():view==='week'?renderWeek():renderPlan()
 $('app').innerHTML=scroll
 document.querySelectorAll('.tabbar button').forEach(b=>b.dataset.view===view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'))
 const keepY=$('layer').querySelector('.workout')?.scrollTop
 $('layer').innerHTML=renderWorkout()+renderSheet()
 const w=$('layer').querySelector('.workout');if(w&&keepY!=null&&!render.resetScroll)w.scrollTop=keepY
 render.resetScroll=false
 drawTimer()
}

document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-act]');if(!t)return
 const d=t.dataset
 if(d.act==='sheet-bg'&&e.target!==t)return
 if(d.view){view=d.view;planFor=null;render();scrollTo(0,0)}
 else if(d.me){me=d.me;store.set('who',me);sb?.auth.updateUser({data:{who:me}});$('gate').hidden=true;render()}
 else if(d.start){const date=d.pickDate!=null?($('other-date')?.value||today):today;sheetOpen=false;startWorkout(d.for||me,d.start,date)}
 else if(d.open)openWorkout(d.open)
 else if(d.plan){planFor=d.plan;render()}
 else if(d.week){if(d.week==='0')weekStart=mondayOf(new Date());else weekStart.setDate(weekStart.getDate()+7*d.week);render()}
 else if(d.set&&workout){
  const c={...checkins[workout.key],rounds:{...checkins[workout.key].rounds}},was=c.rounds[d.set]
  if(was)delete c.rounds[d.set];else{c.rounds[d.set]=1;startRest(+d.rest)}
  save(c)
 }
 else if(d.pick&&workout){const c={...checkins[workout.key]};c[d.pick]=c[d.pick]===d.id?null:d.id;save(c)}
 else if(d.step&&workout){
  if(d.step==='done'){closeWorkout();view='today';return}
  const n=programOf(checkins[workout.key]).ex.length
  workout.step=Math.max(0,Math.min(n+2,workout.step+ +d.step));rest=null;confirmRemove=false
  store.set('workout',JSON.stringify(workout));render.resetScroll=true;render()
 }
 else if(d.rest==='skip'){rest=null;drawTimer()}
 else if(d.rest==='+15'&&rest){rest.ends+=15000;rest.total+=15;drawTimer()}
 else if(d.act==='close')closeWorkout()
 else if(d.act==='remove'){if(confirmRemove)remove(workout.key);else{confirmRemove=true;render()}}
 else if(d.act==='other'){sheetOpen=true;sheetDate=today;render()}
 else if(d.act==='sheet-bg'){sheetOpen=false;render()}
 else if(d.act==='hide-install'){store.set('hideInstall','1');render()}
 else if(d.act==='share'){const url=location.href.split('#')[0];navigator.share?navigator.share({title:'MG Gym',text:'Our gym plan',url}).catch(()=>{}):navigator.clipboard?.writeText(url).then(()=>{syncNote='Link copied: '+url;view='today';render()})}
 else if(d.act==='switch'){$('gate').hidden=false;$('gate-form').hidden=true;$('who').hidden=false}
 else if(d.act==='signout'){sb?.auth.signOut();checkins={};store.set('workout',null)}
})
document.addEventListener('change',e=>{if(e.target.id==='other-date')sheetDate=e.target.value})
// coming back to the app after a while: refresh the date (it may be a new day) and pull the partner's latest sets
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();if(rest)runTimer();load?.()}})

let load=null
;(()=>{
 const C=window.MG_CONFIG||{},gate=$('gate')
 const saved=store.get('workout');if(saved)try{workout=JSON.parse(saved)}catch(e){}
 if(!window.supabase||!C.url||/YOUR_/.test(C.url+C.anonKey)){syncNote='Sync is off: add the Supabase keys to config.js.';if(!me){gate.hidden=false;$('gate-form').hidden=true;$('who').hidden=false}render();return}
 sb=window.supabase.createClient(C.url,C.anonKey,{auth:{persistSession:true,autoRefreshToken:true}})
 let channel=null,mode='email'
 load=async()=>{
  const {data,error}=await sb.from('checkins').select('*')
  if(error){syncNote='Couldn\'t load your check-ins. Close and reopen the app to try again.';render();return}
  checkins={};data.forEach(r=>{checkins[r.key]={...r,date:String(r.date).slice(0,10)}});syncNote='';render()
 }
 const listen=()=>{if(channel)return;channel=sb.channel('checkins-live').on('postgres_changes',{event:'*',schema:'public',table:'checkins'},p=>{
  if(p.eventType==='DELETE'){delete checkins[p.old.key];if(workout?.key===p.old.key)closeWorkout()}else checkins[p.new.key]={...p.new,date:String(p.new.date).slice(0,10)};render()}).subscribe()}
 // who owns this phone is saved on the account too, so reinstalling the app doesn't ask again
 async function start(session){
  gate.hidden=!!session;$('gate-form').hidden=false;$('who').hidden=true
  if(!session)return
  const onAccount=session.user.user_metadata?.who
  me=onAccount||me
  if(me&&!onAccount)sb.auth.updateUser({data:{who:me}})
  if(me)store.set('who',me);else{gate.hidden=false;$('gate-form').hidden=true;$('who').hidden=false}
  await load();listen()
 }
 sb.auth.getSession().then(({data})=>start(data.session))
 sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')start(session)})
 const setMode=m=>{mode=m;const up=m==='signup';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));$('gate-btn').textContent=up?'Create account':'Sign in';$('gate-pass').autocomplete=up?'new-password':'current-password';$('gate-msg').textContent=up?'Pick a password. You\'ll get one email to confirm it\'s you.':'Your shared plan for Moderncoach Deggendorf.';$('gate-err').hidden=true}
 document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)))
 $('gate-form').addEventListener('submit',async e=>{
  e.preventDefault();const err=$('gate-err'),btn=$('gate-btn'),email=$('gate-email').value.trim().toLowerCase(),password=$('gate-pass').value;err.hidden=true
  if(!email||password.length<6){err.textContent='Enter your email and a password of at least 6 characters.';err.hidden=false;return}
  btn.disabled=true
  if(mode==='signup'){
   const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}})
   btn.disabled=false
   if(error){err.textContent='Couldn\'t create the account: '+error.message;err.hidden=false;return}
   if(!data.session){setMode('email');$('gate-msg').textContent='Almost there: open the email from Supabase and tap the link. Then come back here and sign in.'}
  }else{
   const {error}=await sb.auth.signInWithPassword({email,password})
   btn.disabled=false
   if(error){err.textContent=/confirm/i.test(error.message)?'Confirm your email first: tap the link in the email from Supabase, then sign in here.':'Wrong email or password. New here? Switch to "Create account".';err.hidden=false}
  }
 })
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})
})()
</script>
</body>
</html>

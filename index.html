<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MG Gym">
<meta name="theme-color" content="#fdf6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#120d10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>MG Gym</title>
<style>
/* iPhone system fonts (SF Pro / SF Pro Rounded) so it reads as a native app and works offline */
:root{
  --bg:#fdf6f3;--card:#fff;--fill:#f4e9e6;--ink:#2a1f24;--muted:#97868c;--line:rgba(120,70,80,.12);
  --v:#ff6f91;--d:#5b8cff;--both:#a77bff;--v-soft:#ffe6ee;--d-soft:#e6eeff;--both-soft:#f1e9ff;
  --shadow:0 1px 2px rgba(120,60,70,.05),0 10px 28px rgba(160,90,100,.09);
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",monospace;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --sk:#56575d;--sk2:#bdbec3;--paper:#fafafa;--red:#ff5a6e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#120d10;--card:#1f181c;--fill:#2d2429;--ink:#f8eef1;--muted:#a3949a;--line:rgba(255,220,230,.1);
  --v-soft:#3d1a26;--d-soft:#16244a;--both-soft:#2a1d45;--shadow:none;
  --sk:#cfd0d5;--sk2:#4c4d53;--paper:#232325;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--text);min-height:100dvh;overscroll-behavior-y:none}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc,var(--d));outline-offset:2px}

/* each person keeps their colour everywhere: coral Vicky, blue Delian, violet when it's a shared session */
.pv{--acc:var(--v);--acc-soft:var(--v-soft)}.pd{--acc:var(--d);--acc-soft:var(--d-soft)}.pb{--acc:var(--both);--acc-soft:var(--both-soft)}

.view{padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px);max-width:560px;margin:0 auto;display:grid;gap:18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.eyebrow{font:600 .78rem/1.2 var(--text);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.title{font:800 1.85rem/1.08 var(--round);letter-spacing:-.02em}
.avatar{display:inline-block;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;font:700 1rem/38px var(--round);text-align:center;flex:none}
.section{font:700 1.25rem/1.2 var(--round);letter-spacing:-.01em}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)}
.small{font-size:.86rem}

.hero{position:relative;overflow:hidden;border-radius:30px;padding:20px;color:#fff;background:var(--acc);display:grid;gap:14px;min-height:220px;align-content:end;isolation:isolate}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:saturate(.8)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.25) 40%,color-mix(in srgb,var(--acc) 82%,#000) 100%)}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.hero h2{font:800 2rem/1.05 var(--round);letter-spacing:-.02em}
.hero .meta{font-size:.92rem;opacity:.92}
.hero .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.hero.rest{background:var(--card);color:var(--ink);min-height:0}
.hero.rest::before{display:none}
.hero.rest .eyebrow{color:var(--muted)}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font:700 1.08rem/1 var(--round);background:#fff;color:color-mix(in srgb,var(--acc) 85%,#000)}
.big.solid{background:var(--acc);color:#fff}
.big.soft{background:var(--fill);color:var(--ink)}

.partner{display:flex;align-items:center;gap:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none}
.partner .avatar{width:34px;height:34px;line-height:34px;font-size:.9rem}
.partner div{display:grid;gap:1px;min-width:0}
.partner b{font-weight:600}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.strip span{font:600 .72rem/1 var(--text);color:var(--muted)}
.strip i{display:grid;place-items:center;margin:6px auto 0;width:34px;height:34px;border-radius:50%;background:var(--fill);font:700 .85rem/1 var(--round);font-style:normal;color:var(--muted);position:relative}
.strip i.done{background:var(--acc);color:#fff}
.strip i.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.strip i.mate::after{content:"";position:absolute;bottom:-7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--mate)}

.phase{display:grid;gap:10px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps4 i{height:5px;border-radius:9px;background:var(--fill)}
.steps4 i.on{background:var(--acc)}
.phase h3{font:700 1.05rem/1.2 var(--round)}

.list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;border-top:1px solid var(--line);text-decoration:none}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0;display:grid;gap:2px}
.row .grow b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);font-size:1.2rem}
.tag{font:700 .7rem/1 var(--text);padding:5px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;padding:8px 8px calc(var(--safe-b) + 6px);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--line)}
.tabbar button,.tabbar label{display:grid;justify-items:center;gap:3px;font:600 .68rem/1 var(--text);color:var(--muted);padding:4px 6px;flex:1;cursor:pointer}
/* the camera sits raised in the middle so sending an instant is one thumb-tap from anywhere */
.tabbar .cam{flex:none;width:58px;height:58px;margin-top:-22px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--both));color:#fff;place-content:center;box-shadow:0 8px 20px color-mix(in srgb,var(--v) 40%,transparent),0 0 0 5px var(--bg)}
.tabbar .cam svg{width:28px;height:28px}
.tabbar button[aria-current="page"]{color:var(--acc)}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:3px}
.seg button{padding:9px;border-radius:10px;font:600 .92rem/1 var(--text);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.stats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none;min-width:120px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;gap:4px}
.stat b{font:800 1.35rem/1.1 var(--round);letter-spacing:-.01em}

details.day{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
details.day>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary .chev{transition:transform .2s}
details.day[open]>summary .chev{transform:rotate(90deg)}
.wkday{width:48px;height:48px;border-radius:14px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font:800 .82rem/1 var(--round);flex:none;text-transform:uppercase}
.exrow{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.exrow img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--fill)}
.exrow b{font-weight:600}
.load{font:500 .8rem/1.3 var(--mono);color:var(--muted)}

.how{margin-top:8px}
.how summary{cursor:pointer;font:600 .86rem/1 var(--text);color:var(--acc);list-style:none}
.how summary::-webkit-details-marker{display:none}
.how .in{display:grid;gap:10px;margin-top:10px;font-size:.9rem}
.how ul{margin:0;padding-left:18px;display:grid;gap:4px}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{font:600 .8rem/1 var(--text);text-decoration:none;background:var(--fill);border-radius:99px;padding:8px 12px}
.sk{width:100%;max-width:240px;aspect-ratio:4/3;background:var(--paper);border-radius:14px}
.sk .bd{fill:none;stroke:var(--sk);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sk .bd2{fill:none;stroke:var(--sk2);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.sk .hd{fill:var(--paper);stroke:var(--sk);stroke-width:2.2}
.sk .pr{fill:none;stroke:var(--sk2);stroke-width:1.6;stroke-linecap:round}
.sk .cb{stroke:var(--sk2);stroke-width:1;stroke-dasharray:2 3}
.sk .fl{stroke:var(--sk2);stroke-width:1;stroke-dasharray:1 4}
.sk .gd{fill:none;stroke:var(--sk);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.sk .mu{fill:var(--red);fill-opacity:.2;stroke:var(--red);stroke-width:1;stroke-dasharray:2 2}
.sk .ar{fill:none;stroke:var(--red);stroke-width:1.8;stroke-linecap:round}

.weekhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weekhead button.circle{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font:600 1.1rem/1 var(--text)}
.dayrow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.dayrow:first-child{border-top:0}
.dayrow .d{display:grid;justify-items:center;font:600 .72rem/1.1 var(--text);color:var(--muted)}
.dayrow .d b{font:800 1.3rem/1 var(--round);color:var(--ink)}
.dayrow.now .d b{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:12px;background:var(--acc-soft);font:600 .84rem/1 var(--text)}
.chip small{font:700 .78rem/1 var(--round);color:var(--acc)}

/* workout mode is a full-screen sheet so the tab bar and everything else get out of the way at the gym */
.workout{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.wtop{position:sticky;top:0;z-index:2;display:grid;gap:10px;padding:calc(var(--safe-t) + 8px) 16px 10px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.wtop .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wtitle{flex:1;display:grid;justify-items:center;gap:4px;min-width:0}
.wtop h1{font:700 1rem/1.2 var(--round);text-align:center}
.onair{font:600 .72rem/1 var(--text);color:var(--acc);background:var(--acc-soft);padding:5px 9px;border-radius:99px}
.icon.confirm{width:auto;padding:0 12px;border-radius:99px;color:var(--v);font-size:.8rem}
.icon{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font:600 1.05rem/1 var(--text)}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:4px;border-radius:9px;background:var(--fill)}
.segs i.done{background:var(--acc)}
.segs i.here{background:color-mix(in srgb,var(--acc) 45%,var(--fill))}
.wbody{max-width:560px;margin:0 auto;padding:6px 16px calc(var(--safe-b) + 170px);display:grid;gap:16px}
.photo{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:2/1;background:var(--fill)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo span{position:absolute;left:12px;bottom:12px;font:600 .76rem/1 var(--text);color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 10px;border-radius:99px}
.exname{font:800 1.7rem/1.1 var(--round);letter-spacing:-.02em}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.specs div{background:var(--card);border-radius:16px;padding:12px 14px;display:grid;gap:3px;box-shadow:var(--shadow)}
.specs b{font:700 1.08rem/1.15 var(--round)}
.specs span{font-size:.76rem;color:var(--muted)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.set{aspect-ratio:1;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-content:center;justify-items:center;gap:2px;transition:transform .12s}
.set b{font:800 1.5rem/1 var(--round)}
.set span{font:600 .68rem/1 var(--text);color:var(--muted)}
.set:active{transform:scale(.94)}
.set.on{background:var(--acc);box-shadow:none;color:#fff}
.set.on span{color:rgba(255,255,255,.85)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt a{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-decoration:none}
.play{width:36px;height:36px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none;font-size:.8rem}
.opt .grow{display:grid;gap:2px;min-width:0}
.tick{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none;font-weight:800;color:transparent}
.tick.on{background:var(--acc);box-shadow:none;color:#fff}
.stepnav{position:fixed;left:0;right:0;bottom:0;z-index:31;display:flex;gap:10px;padding:12px 16px calc(var(--safe-b) + 12px);background:linear-gradient(transparent,var(--bg) 30%)}
.stepnav .big{flex:1}
.stepnav .icon{width:54px;height:54px;border-radius:16px;font-size:1.3rem}
.timer{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 84px);z-index:32;max-width:528px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:20px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.timer svg{width:40px;height:40px;transform:rotate(-90deg);flex:none}
.timer circle{fill:none;stroke-width:4}
.timer .grow{flex:1;display:grid;gap:1px}
.timer b{font:800 1.4rem/1 var(--round);font-variant-numeric:tabular-nums}
.timer span{font-size:.76rem;opacity:.7}
.timer button{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bg) 16%,transparent);font:700 .84rem/1 var(--text)}
.timer.go{background:var(--acc);color:#fff}
.finish{text-align:center;display:grid;gap:12px;justify-items:center;padding-top:30px}
.finish .badge{width:96px;height:96px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:2.8rem}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:grid;align-items:end}
.sheet>div{background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(var(--safe-b) + 20px);display:grid;gap:14px;max-height:85dvh;overflow:auto}
.grab{width:38px;height:5px;border-radius:9px;background:var(--fill);margin:0 auto}
.sheet input[type=date]{font:600 1rem var(--text);padding:12px;border-radius:12px;border:0;background:var(--card);color:var(--ink);width:100%}

.banner{display:flex;gap:12px;align-items:center;background:var(--acc-soft);border-radius:18px;padding:12px 14px;font-size:.88rem}
.banner b{display:block}
.status{background:var(--fill);border-radius:14px;padding:10px 14px;font-size:.86rem}

.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px 20px}
.gate form{width:100%;max-width:380px;display:grid;gap:12px}
.gate img{width:76px;height:76px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:6px}
.gate h1{font:800 2rem/1.05 var(--round);letter-spacing:-.02em}
.gate input{font:500 1.05rem var(--text);padding:15px 14px;border:0;border-radius:14px;background:var(--card);color:var(--ink);width:100%;box-shadow:var(--shadow)}
.gate .err{color:var(--v);font-size:.88rem}
.gate .pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gate form:has([aria-pressed="true"]) .pick button[aria-pressed="false"]{opacity:.45}
.gate .pick button{transition:opacity .15s;border-radius:20px;padding:22px 10px;background:var(--acc);color:#fff;font:800 1.2rem/1 var(--round);display:grid;justify-items:center;gap:10px}
.gate .pick .avatar{background:rgba(255,255,255,.25);width:52px;height:52px;line-height:52px;font-size:1.4rem}

.emo{font-size:.85em}
.heart{width:44px;height:44px;border-radius:50%;background:var(--acc-soft);font-size:1.3rem;flex:none;transition:transform .15s}
.heart:active{transform:scale(1.3)}
.together{display:block;color:var(--acc);font-weight:600;margin-top:2px}
.center{text-align:center}
.sechead{display:flex;align-items:center;justify-content:space-between}
.pill{font:700 .82rem/1 var(--text);padding:9px 13px;border-radius:99px;background:var(--acc-soft);color:var(--acc);cursor:pointer}
.instants{display:grid;gap:12px}
.empty{display:grid;justify-items:center;gap:6px;text-align:center;padding:22px 18px;border-radius:24px;border:2px dashed color-mix(in srgb,var(--acc) 35%,transparent);background:color-mix(in srgb,var(--acc-soft) 50%,var(--card));cursor:pointer}
.bigemo{font-size:2rem;line-height:1}
.polaroids{display:flex;gap:14px;justify-content:center;padding:6px 0}
/* instants look like little polaroids, slightly tilted, blurred until opened */
.polaroid{background:#fff;padding:10px 10px 0;border-radius:6px;box-shadow:0 10px 26px rgba(80,40,50,.18);transform:rotate(var(--tilt));display:grid;width:150px;transition:transform .2s}
.polaroid:active{transform:rotate(0) scale(.97)}
.polaroid .ph{display:block;aspect-ratio:4/5;background:#eee center/cover;border-radius:2px}
.polaroid .ph.blur{filter:blur(14px) saturate(1.3);transform:scale(1.02)}
.polaroid .cap{font:600 .78rem/1.2 var(--round);color:#5a4a50;padding:10px 2px 12px;text-align:center;border:0;background:none;width:100%}
.polaroid.big{width:min(78%,300px);margin:6px auto}
.polaroid input.cap:focus{outline:none}
.sent{color:var(--muted);text-align:center}
.sent b{color:var(--acc)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.big{cursor:pointer}
.join{width:100%;text-align:left;color:var(--ink)}
.join b{display:block}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:18px;flex:none}
.eq i{width:4px;border-radius:2px;background:var(--acc);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.stations{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.station{position:relative;text-align:left;background:var(--card);border-radius:22px;padding:14px;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow)}
.station b{font:700 1rem/1.2 var(--round)}
.station .tag{justify-self:start;margin-top:4px}
.station.on{box-shadow:0 0 0 2.5px var(--acc),var(--shadow)}
.station .eq,.station .mate{position:absolute;top:14px;right:14px;margin:0}
.tag.mate{background:var(--d-soft);color:var(--d)}
.onair-card{display:flex;align-items:center;gap:14px;padding:18px;border-radius:26px;background:linear-gradient(135deg,var(--acc-soft),var(--card));box-shadow:var(--shadow)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b5c;margin-right:4px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.playbtn{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;font:700 .9rem/1 var(--text);flex:none}

.mini-in{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.mini-in b{display:block}
.mini .playbtn{width:40px;height:40px}
body:has(.mini:not([hidden])) .view{padding-bottom:calc(var(--safe-b) + 160px)}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center}
.viewer img{width:100%;height:100%;object-fit:contain;background:#000}
.vtop{position:absolute;top:calc(var(--safe-t) + 10px);left:14px;right:14px;display:flex;align-items:center;gap:10px;color:#fff}
.vtop span:nth-child(2){flex:1}
.vtop .icon{background:rgba(255,255,255,.18);color:#fff}
.vcap{position:absolute;left:20px;right:20px;bottom:calc(var(--safe-b) + 100px);text-align:center;color:#fff;font:700 1.15rem/1.3 var(--round);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.big-heart{position:absolute;bottom:calc(var(--safe-b) + 28px);left:50%;margin-left:-30px;width:60px;height:60px;font-size:1.7rem;background:rgba(255,255,255,.16)}
.toast{position:fixed;top:calc(var(--safe-t) + 10px);left:16px;right:16px;z-index:80;max-width:440px;margin:0 auto;padding:13px 16px;border-radius:18px;background:var(--ink);color:var(--bg);font:600 .92rem/1.3 var(--text);text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:drop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}

.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.topbtns{display:flex;align-items:center;gap:8px}
.passbtn{width:38px;height:38px;font-size:1.1rem;background:var(--card);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:var(--card);border-radius:20px;padding:14px;display:grid;gap:4px;text-align:left;box-shadow:var(--shadow);border-top:4px solid var(--acc)}
.tile b{font:700 .98rem/1.2 var(--round)}
.streaks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.streak{background:linear-gradient(160deg,var(--acc-soft),var(--card) 70%);border-radius:20px;padding:12px;display:grid;gap:3px;box-shadow:var(--shadow)}
.streak b{font:800 1.15rem/1.1 var(--round);color:var(--acc)}
.rings{display:flex;justify-content:space-around}
.ring{position:relative;display:grid;justify-items:center;gap:4px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--fill)}.ring .fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring b{position:absolute;top:30px;font:800 1.05rem/1 var(--round)}
.ring span{font:600 .8rem/1 var(--text)}
.cal{display:grid;gap:12px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr) 28px;gap:4px;text-align:center}
.calgrid>span{font:600 .7rem/1 var(--text);color:var(--muted);padding:4px 0;align-self:center}
.calgrid .day{position:relative;aspect-ratio:1;border-radius:12px;background:var(--fill);display:grid;place-items:center;padding:0}
.calgrid .day i{position:absolute;top:3px;left:5px;font:600 .62rem/1 var(--text);font-style:normal;color:var(--muted)}
.calgrid .day em{font-style:normal;font-size:1.15rem;line-height:1;margin-top:6px}
.calgrid .day.out{opacity:.35}
.calgrid .day.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.calgrid .day.now{box-shadow:0 0 0 2px var(--acc)}
.calgrid .day:has(em){background:var(--acc-soft)}
.calgrid .matedot{position:absolute;bottom:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--mate,var(--v))}
.pd .calgrid .matedot{background:var(--v)}.pv .calgrid .matedot{background:var(--d)}
.calgrid .wk{font-size:1rem}
.passview{position:fixed;inset:0;z-index:55;background:#fff;color:#2a1f24;display:grid;align-content:start;gap:20px;padding:calc(var(--safe-t) + 12px) 20px calc(var(--safe-b) + 20px)}
.passview .bar{display:flex;gap:10px;align-items:center}
.passview .seg{flex:1;background:#f4e9e6}
.passview .seg button[aria-pressed="true"]{background:#fff}
.passview .icon{background:#f4e9e6;color:#2a1f24}
.pass{display:grid;justify-items:center;gap:12px;text-align:center;padding:18px;border-radius:28px;background:linear-gradient(180deg,var(--acc-soft),#fff 40%)}
.pass .eyebrow{color:#97868c}
.qr{width:min(78vw,320px);aspect-ratio:1;image-rendering:pixelated;background:#fff;padding:14px;border-radius:20px;box-shadow:0 10px 30px rgba(80,40,50,.12)}
.note-bg{align-items:center;padding:20px}
.sheet>.lovenote{max-height:none;padding-bottom:24px}
.sheet>.lovenote,.lovenote{background:#fffaf5;color:#4a2a33;border-radius:26px;padding:24px 22px;display:grid;gap:12px;justify-items:center;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .45s cubic-bezier(.2,1.5,.4,1);max-width:400px;margin:0 auto;width:100%}
.lovenote .eyebrow{color:#b08a94}
.lovenote .paper{font:600 1.2rem/1.45 var(--round);background:repeating-linear-gradient(transparent 0 30px,#f3dfe3 30px 31px);padding:6px 4px}
.lovenote .sig{font:700 1.05rem var(--round);color:var(--v);justify-self:end}
.lovenote .bigemo{font-size:3rem}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.field{font:500 1.05rem var(--text);padding:15px 14px;border:0;border-radius:14px;background:var(--card);color:var(--ink);width:100%;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}}

let me=store.get('who'),view='today',planFor=null
let checkins={},sb=null,syncNote='',confirmRemove=false
let workout=null   // {key, step}; step 0 = warm-up, 1..n = exercises, n+1 = recovery, n+2 = finished
let rest=null      // {ends, total}

const totalRounds=program=>program.ex.reduce((sum,e)=>sum+e[4],0)
const roundsDone=c=>Object.keys(c?.rounds||{}).length
const programOf=c=>PROGRAMS[c.person].find(p=>p.id===c.program)
const checkinsOf=(person,date)=>Object.values(checkins).filter(c=>c.person===person&&(!date||c.date===date))
const accentClass=(program,person)=>program?.both?'pb':'p'+person

// the 8-week block starts at each person's first check-in, like the original plan says
function programWeek(person){
 const first=checkinsOf(person).map(c=>c.date).sort()[0]
 if(!first)return 1
 return Math.min(8,Math.floor((mondayOf(atNoon(today))-mondayOf(atNoon(first)))/6048e5)+1)
}
const sentence=t=>t.charAt(0).toUpperCase()+t.slice(1)
const phaseIndex=week=>week<=2?0:week<=6?1:week===7?2:3

// rest values in the plan read like "90 s", "1–2 min" or "2–3 min"; the timer uses the lower bound so nobody waits longer than planned
function restSeconds(text){const n=parseFloat(text);return /min/.test(text)?n*60:n}

const row=c=>({key:c.key,date:c.date,person:c.person,program:c.program,rounds:c.rounds||{},warm:c.warm||null,cool:c.cool||null,at:c.at||new Date().toISOString()})
async function save(c){
 checkins[c.key]=c;render()
 if(!sb)return
 const {error}=await sb.from('checkins').upsert(row(c))
 if(error){syncNote='That change didn\'t reach the server. It\'s kept on this phone; check your connection.';render()}
}
async function remove(key){
 delete checkins[key];closeWorkout()
 if(!sb)return
 const {error}=await sb.from('checkins').delete().eq('key',key)
 if(error){syncNote='Couldn\'t remove that check-in from the server. Try again with a connection.';render()}
}
function startWorkout(person,programIdToStart,date=today){
 const key=`${date}_${person}_${programIdToStart}`
 if(!checkins[key])save({key,date,person,program:programIdToStart,rounds:{},warm:null,cool:null,at:new Date().toISOString()})
 openWorkout(key)
}
function openWorkout(key,step){
 const c=checkins[key],program=programOf(c)
 // reopening jumps to the first exercise with unticked sets, so a paused session picks up where it stopped
 const resume=c.warm?1+Math.max(0,program.ex.findIndex((e,ei)=>[...Array(e[4])].some((_,ri)=>!c.rounds?.[`${ei}-${ri}`]))):0
 workout={key,step:step??(roundsDone(c)===totalRounds(program)?program.ex.length+1:resume)}
 store.set('workout',JSON.stringify(workout));confirmRemove=false;keepAwake(true);render()
}
function closeWorkout(){workout=null;rest=null;store.set('workout',null);keepAwake(false);render()}

let wakeLock=null
async function keepAwake(on){
 try{if(on&&!wakeLock&&navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen');if(!on&&wakeLock){wakeLock.release();wakeLock=null}}catch(e){wakeLock=null}
}

let tick=null
function startRest(seconds){rest={ends:Date.now()+seconds*1000,total:seconds};runTimer()}
// the "Go" state stays up for a few seconds after the rest ends, then the bar tucks itself away
function runTimer(){
 clearInterval(tick);drawTimer()
 tick=setInterval(()=>{if(rest&&Date.now()>rest.ends+5000)rest=null;drawTimer();if(!rest)clearInterval(tick)},250)
}
function drawTimer(){
 const el=$('timer');if(!el)return
 if(!rest){el.hidden=true;return}
 const left=Math.max(0,Math.ceil((rest.ends-Date.now())/1000)),done=left===0
 if(done&&!rest.buzzed){rest.buzzed=true;navigator.vibrate?.([120,60,120])}
 const r=16,len=2*Math.PI*r,frac=done?1:1-left/rest.total
 el.hidden=false;el.className='timer'+(done?' go':'')
 el.innerHTML=`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="${r}" stroke="currentColor" stroke-opacity=".2"/><circle cx="20" cy="20" r="${r}" stroke="currentColor" stroke-dasharray="${len}" stroke-dashoffset="${len*(1-frac)}" stroke-linecap="round"/></svg>
 <div class="grow"><b>${done?'Go':Math.floor(left/60)+':'+pad(left%60)}</b><span>${done?'Next set when you\'re ready':'Rest'}</span></div>
 ${done?'':'<button data-rest="+15">+15 s</button>'}<button data-rest="skip">${done?'OK':'Skip'}</button>`
}

const avatar=(p,egg)=>`<span class="avatar p${p}"${egg?` data-act="egg" data-egg="${egg}"`:''}>${NAME[p][0]}</span>`

function partnerLine(){
 const mate=PARTNER[me],theirs=checkinsOf(mate,today)[0],theirProgram=theirs&&programOf(theirs)
 const text=!theirs?'Not at the gym yet':roundsDone(theirs)===totalRounds(theirProgram)?`Finished ${PROGRAM_NAME[theirs.program].toLowerCase()} ✓`:`${PROGRAM_NAME[theirs.program]} · ${roundsDone(theirs)} of ${totalRounds(theirProgram)} sets`
 const together=sessionsTogether()
 return `<div class="card partner p${mate}">${avatar(mate,'avatar')}<div style="flex:1"><b>${NAME[mate]}</b><span class="muted small">${text}</span>${together?`<span class="small together">💞 ${together} session${together>1?'s':''} together</span>`:''}</div><button class="heart" data-act="heart" aria-label="Send ${NAME[mate]} a heart">💗</button></div>`
}

function weekStrip(person){
 const monday=mondayOf(atNoon(today)),mate=PARTNER[person]
 return `<div class="card strip p${person}" style="--mate:var(--${mate})">${[...Array(7)].map((_,i)=>{
  const d=new Date(monday);d.setDate(d.getDate()+i);const s=iso(d)
  const cls=[checkinsOf(person,s).length&&'done',s===today&&'today',checkinsOf(mate,s).length&&'mate'].filter(Boolean).join(' ')
  return `<div><span>${'MTWTFSS'[i]}</span><i class="${cls}">${d.getDate()}</i></div>`}).join('')}</div>`
}


function installBanner(){
 const iphone=/iPhone|iPad/.test(navigator.userAgent),installed=navigator.standalone||matchMedia('(display-mode: standalone)').matches
 if(!iphone||installed||store.get('hideInstall'))return ''
 return `<div class="banner"><div style="flex:1"><b>Put MG Gym on your Home Screen</b>Tap <b style="display:inline">Share ⬆︎</b>, then <b style="display:inline">Add to Home Screen</b>. It opens full-screen like any app.</div><button class="icon" data-act="hide-install" aria-label="Hide">✕</button></div>`
}

function renderToday(){
 const greet=greeting(),started=checkinsOf(me,today).sort((x,y)=>roundsDone(x)===totalRounds(programOf(x))?1:-1)[0]
 const week=programWeek(me),[phaseLabel,...phaseText]=PLAN[me].phases[phaseIndex(week)].split(': ')
 return `<div class="view p${me}">
  <header class="top"><div><p class="eyebrow">${atNoon(today).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p><h1 class="title">${greet[0]},<br>${NAME[me]} <span data-act="egg" data-egg="greeting">${greet[1]}</span></h1></div>
   <div class="topbtns"><button class="icon passbtn" data-act="pass" aria-label="Show gym pass">🎫</button><button data-view="plan" aria-label="Your plan">${avatar(me)}</button></div></header>
  ${installBanner()}
  ${syncNote?`<p class="status">${syncNote}</p>`:''}
  ${joinBanner()}
  ${started?sessionHero(started):programPicker()}
  ${instantsSection()}
  ${partnerLine()}
  <h2 class="section">This week</h2>
  ${weekStrip(me)}
  <section class="card phase"><div class="steps4">${[0,1,2,3].map(i=>`<i class="${i<=phaseIndex(week)?'on':''}"></i>`).join('')}</div><p class="eyebrow">Week ${week} of 8 · ${phaseLabel}</p><h3>${sentence(phaseText.join(': '))}</h3></section>
  <button class="big soft" data-act="other">Log a workout for another day</button>
 </div>`
}
const emojiFor=id=>id==='chestback'?`<span class="emo" data-act="egg" data-egg="butterfly">🦋</span>`:`<span class="emo">${PROGRAM_EMOJI[id]}</span>`
function sessionHero(c){
 const shown=programOf(c),total=totalRounds(shown),done=roundsDone(c)
 return `<section class="hero ${accentClass(shown,me)}"><img src="${IMG[shown.ex[0][2]]}" alt="">
  <p class="eyebrow">Today · ${shown.both?`with ${NAME[PARTNER[me]]}`:'solo'}</p>
  <h2>${shown.t} ${emojiFor(shown.id)}</h2>
  <p class="meta">${shown.ex.length} exercises · ${total} sets · ${shown.s.split('· ').pop()}</p>
  <div class="bar"><i style="width:${done/total*100}%"></i></div><p class="meta">${done} of ${total} sets done</p>
  <button class="big" data-open="${c.key}">${done===total?'Done · view session':'Continue workout'}</button></section>`
}
function programPicker(){
 const [pick,why]=suggestedProgram(),p=PROGRAMS[me].find(x=>x.id===pick),others=PROGRAMS[me].filter(x=>x.id!==pick)
 return `<section class="hero ${accentClass(p,me)}"><img src="${IMG[p.ex[0][2]]}" alt="">
  <p class="eyebrow">${why==='join'?`${NAME[PARTNER[me]]} just started this · join in`:`Suggested · last time ${sinceLabel(lastDone(me,p.id))}`}</p>
  <h2>${p.t} ${emojiFor(p.id)}</h2>
  <p class="meta">${p.ex.length} exercises · ${totalRounds(p)} sets · ${p.s.split('· ').pop()}${p.both?' · together':''}</p>
  <button class="big" data-start="${p.id}">Start ${p.t.toLowerCase()}</button></section>
  <div><p class="eyebrow" style="margin:0 2px 8px">Or pick another</p><div class="tiles">${others.map(o=>`<button class="tile ${accentClass(o,me)}" data-start="${o.id}"><span class="bigemo">${PROGRAM_EMOJI[o.id]}</span><b>${o.t}</b><span class="small muted">${sinceLabel(lastDone(me,o.id))}</span></button>`).join('')}</div>
  <p class="small muted center" style="margin-top:10px">Not training today? ${REST_TIP[me]}</p></div>`
}

function howTo(key){
 const det=DET[key],demos=(DEMO[key]||[]).map(([label,url])=>`<a href="${url}" target="_blank" rel="noopener">▶ ${label}</a>`).join('')
 if(!det&&!demos)return ''
 return `<details class="how"><summary>How to do it ›</summary><div class="in">${det?`${sketch(key)}<p><b>Feel it in:</b> ${det[0]}</p><ul>${det[1].map(t=>`<li>${t}</li>`).join('')}</ul>`:''}<div class="links">${demos}</div></div></details>`
}

function renderPlan(){
 const who=planFor||me,P=PLAN[who],week=programWeek(who),mine=checkinsOf(who)
 return `<div class="view p${who}">
  <header class="top"><div><p class="eyebrow">8-week program</p><h1 class="title">Plan</h1></div>${avatar(who)}</header>
  <div class="seg" role="group" aria-label="Whose plan">${['v','d'].map(p=>`<button class="p${p}" data-plan="${p}" aria-pressed="${p===who}">${NAME[p]}${p===me?' (you)':''}</button>`).join('')}</div>
  <div class="stats">${P.goal.map(([label,value])=>`<div class="stat"><span class="eyebrow">${label}</span><b>${value}</b></div>`).join('')}
   <div class="stat"><span class="eyebrow">Program week</span><b>${week} of 8</b></div><div class="stat"><span class="eyebrow">Sessions logged</span><b>${mine.length}</b></div></div>
  <section class="card phase"><div class="steps4">${[0,1,2,3].map(i=>`<i class="${i<=phaseIndex(week)?'on':''}"></i>`).join('')}</div>
   ${P.phases.map((x,i)=>{const [l,...t]=x.split(': ');return `<p class="small${i===phaseIndex(week)?'':' muted'}"><b>${l}.</b> ${sentence(t.join(': '))}</p>`}).join('')}</section>
  <h2 class="section">Programs</h2>
  ${PROGRAMS[who].map(p=>`<details class="day ${accentClass(p,who)}"><summary><span class="wkday">${PROGRAM_EMOJI[p.id]}</span><span class="grow" style="flex:1;display:grid;gap:2px"><b>${p.t}</b><span class="muted small">${p.ex.length} exercises · ${p.s.split('· ').pop()} · last ${sinceLabel(lastDone(who,p.id))}</span></span>${p.both?'<span class="tag">Together</span>':''}<span class="chev">›</span></summary>
   ${p.ex.map(([name,cue,img,key,rounds,reps,restText,start,goal])=>`<div class="exrow"><img src="${IMG[img]}" alt="" loading="lazy"><div><b>${name}</b><p class="muted small">${cue}</p><p class="load">${rounds} × ${reps} · rest ${restText}<br>${start} → ${goal}</p>${howTo(key)}</div></div>`).join('')}
   <div style="padding:12px 16px 16px"><button class="big solid" data-start="${p.id}" data-for="${who}">Start ${p.t.toLowerCase()} now</button></div></details>`).join('')}
  <section class="card"><h3 class="section" style="margin-bottom:8px"${who==='v'?' data-act="egg" data-egg="rules"':''}>Rules for ${NAME[who]}</h3><ul style="margin:0;padding-left:18px;display:grid;gap:6px">${P.notes.map(n=>`<li>${n}</li>`).join('')}</ul></section>
  <div class="list">
   <button class="row" data-act="pass"><span class="wkday">🎫</span><span class="grow"><b>Gym pass</b><span class="muted small">Your QR for the door at Moderncoach</span></span><span class="chev">›</span></button>
   ${me==='v'?`<button class="row" data-act="book"><span class="wkday">💌</span><span class="grow"><b>Love notes</b><span class="muted small">${eggsFound.length} of ${LOVE_NOTES.length} found${eggsFound.length<LOVE_NOTES.length?' · keep exploring':' · all of them 🥹'}</span></span><span class="chev">›</span></button>`:''}
   <button class="row" data-act="share"><span class="wkday">📲</span><span class="grow"><b>Share the app</b><span class="muted small">Send the link to ${NAME[PARTNER[me]]}</span></span><span class="chev">›</span></button>
   <button class="row" data-act="password"><span class="wkday">🔐</span><span class="grow"><b>Change password</b><span class="muted small">Signed in as ${NAME[me]}</span></span><span class="chev">›</span></button>
   <button class="row" data-act="signout"><span class="grow"><b style="color:var(--v)">Sign out</b></span></button>
  </div>
  <p class="muted small">Weights are starting estimates: pick the load where the last 2 reps are hard but clean. Plate-loaded numbers are per side unless marked total. Photos: moderncoachgym.de.</p>
 </div>`
}

function workoutStep(c,program,step){
 const n=program.ex.length
 if(step===0){
  const list=program.both?WARM_DUO:WARM_SOLO
  return `<p class="eyebrow">Step 1 · 10 min</p><h2 class="exname">${program.both?'Warm-up':'Pilates warm-up'}</h2><p class="muted">Pick one video, follow along, then tick it.</p>
   ${videoList(list,c,'warm')}
   ${program.both?`<h3 class="section">Posture block</h3><div class="list">${POSTURE.map(([name,dose,url])=>`<a class="row" href="${url}" target="_blank" rel="noopener"><span class="play">▶</span><span class="grow"><b>${name}</b><span class="muted small">${dose}</span></span><span class="chev">›</span></a>`).join('')}</div>`:''}`
 }
 if(step===n+1)return `<p class="eyebrow">Last step · 10 min</p><h2 class="exname">Recovery</h2><p class="muted">Stretch it out before you leave.</p>${tuned&&tuned!==RECOVERY_STATION?`<button class="big soft" data-tune="${RECOVERY_STATION}">🥗 Switch the music to Groove Salad</button>`:''}${videoList(COOL,c,'cool')}`
 if(step===n+2){
  const done=roundsDone(c),total=totalRounds(program)
  return `<div class="finish"><span class="badge">${done===total?'🎉':'✓'}</span><h2 class="exname">${done===total?'Session complete':'Session saved'}</h2><p class="muted">${done} of ${total} sets · warm-up ${c.warm?'✓':'skipped'} · recovery ${c.cool?'✓':'skipped'}</p><p class="muted small">${NAME[c.person]} has trained ${checkinsOf(c.person).filter(x=>x.date>=iso(mondayOf(atNoon(today)))).length} days this week.</p></div>`
 }
 const ei=step-1,[name,cue,img,key,rounds,reps,restText,start,goal]=program.ex[ei]
 return `<div class="photo"><img src="${IMG[img]}" alt="${WHERE[img]} at Moderncoach Deggendorf"><span>📍 ${WHERE[img]}</span></div>
  <div><p class="eyebrow">Exercise ${step} of ${n}</p><h2 class="exname">${name}</h2><p class="muted" style="margin-top:4px">${cue}</p></div>
  <div class="sets">${[...Array(rounds)].map((_,ri)=>{const k=`${ei}-${ri}`;return `<button class="set${c.rounds?.[k]?' on':''}" data-set="${k}" data-rest="${restSeconds(restText)}" aria-pressed="${!!c.rounds?.[k]}"><b>${ri+1}</b><span>${c.rounds?.[k]?'done':reps}</span></button>`}).join('')}</div>
  <div class="specs"><div><b>${start}</b><span>start weight</span></div><div><b>${goal}</b><span>week 8 goal</span></div><div><b>${rounds} × ${reps}</b><span>sets × reps</span></div><div><b>${restText}</b><span>rest between sets</span></div></div>
  ${howTo(key)}`
}

function videoList(list,c,field){
 return `<div class="list">${list.map(([id,title,url])=>{const used=checkinsOf(c.person).filter(x=>x[field]===id).length
  return `<div class="opt"><a href="${url}" target="_blank" rel="noopener"><span class="play">▶</span><span class="grow"><b>${title}</b><span class="muted small">${used?`Done ${used}× before`:'New'}</span></span></a><button class="tick${c[field]===id?' on':''}" data-pick="${field}" data-id="${id}" aria-label="Mark done" aria-pressed="${c[field]===id}">✓</button></div>`}).join('')}</div>`
}

function renderWorkout(){
 if(!workout||!checkins[workout.key])return ''
 const c=checkins[workout.key],program=programOf(c),n=program.ex.length,step=workout.step
 const exDone=ei=>[...Array(program.ex[ei][4])].every((_,ri)=>c.rounds?.[`${ei}-${ri}`])
 const segs=[c.warm,...program.ex.map((_,ei)=>exDone(ei)),c.cool]
 const nextLabel=step===n+2?'Back to today':step===n+1?'Finish':step===0?'Start exercises':step===n?'Recovery':'Next exercise'
 return `<div class="workout ${accentClass(program,c.person)}">
  <div class="wtop"><div class="bar"><button class="icon" data-act="close" aria-label="Close">✕</button><div class="wtitle"><h1>${PROGRAM_EMOJI[program.id]} ${program.t}${c.person!==me?` · ${NAME[c.person]}`:''}${c.date!==today?` · ${shortDate(c.date)}`:''}</h1>${tuned?`<button class="onair" data-act="tune-out">♪ ${stationById(tuned).name} · pause</button>`:''}</div><button class="icon${confirmRemove?' confirm':''}" data-act="remove" aria-label="Remove check-in">${confirmRemove?'Remove?':'⋯'}</button></div>
   <div class="segs">${segs.map((done,i)=>`<i class="${done?'done':i===Math.min(step,n+1)?'here':''}"></i>`).join('')}</div></div>
  <div class="wbody">${workoutStep(c,program,step)}</div>
  <div class="timer" id="timer" hidden></div>
  <nav class="stepnav">${step>0?'<button class="icon" data-step="-1" aria-label="Previous">‹</button>':''}<button class="big solid" data-step="${step===n+2?'done':1}">${nextLabel}</button></nav>
 </div>`
}

function renderSheet(){
 if(!sheetOpen)return ''
 return `<div class="sheet" data-act="sheet-bg"><div class="p${me}"><span class="grab"></span><h2 class="section">Log a workout</h2>
  <label class="small muted">Day<input type="date" id="other-date" value="${sheetDate}" max="${today}"></label>
  <div class="list">${PROGRAMS[me].map(p=>`<button class="row ${accentClass(p,me)}" data-start="${p.id}" data-pick-date><span class="wkday">${PROGRAM_EMOJI[p.id]}</span><span class="grow"><b>${p.t}</b><span class="muted small">${p.ex.length} exercises</span></span><span class="chev">›</span></button>`).join('')}</div></div></div>`
}
let sheetOpen=false,sheetDate=today

function render(){
 today=iso(new Date())
 if(!me)return
 if(me==='v'&&new Date().getHours()<5&&!eggsFound.includes('night'))return findEgg('night')
 document.body.className='p'+me
 const scroll=view==='today'?renderToday():view==='progress'?renderProgress():view==='radio'?renderRadio():renderPlan()
 $('app').innerHTML=scroll
 document.querySelectorAll('.tabbar button').forEach(b=>b.dataset.view===view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'))
 const keepY=$('layer').querySelector('.workout')?.scrollTop
 $('layer').innerHTML=renderWorkout()+renderSheet()+renderDaySheet()+renderComposer()+renderViewer()+renderPass()+renderPasswordSheet()+renderNotesBook()+renderNote()
 // the Radio screen already has the big now-playing card, so the mini player only follows you elsewhere
 $('mini').innerHTML=miniPlayer();$('mini').hidden=!tuned||view==='radio'
 const w=$('layer').querySelector('.workout');if(w&&keepY!=null&&!render.resetScroll)w.scrollTop=keepY
 render.resetScroll=false
 drawTimer()
}

document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-act]');if(!t)return
 const d=t.dataset
 // a tap inside a sheet bubbles up to its backdrop; only a tap on the backdrop itself should close it
 if(/-bg$/.test(d.act)&&e.target!==t)return
 if(d.view){view=d.view;planFor=null;render();scrollTo(0,0)}
 else if(d.login)chooseLogin(d.login)
 else if(d.start){const date=d.pickDate!=null?($('other-date')?.value||today):today;sheetOpen=false;startWorkout(d.for||me,d.start,date)}
 else if(d.open){dayOpen=null;openWorkout(d.open)}
 else if(d.day){dayOpen=d.day;render()}
 else if(d.month){if(d.month==='0'){monthStart=new Date();monthStart.setDate(1);monthStart.setHours(12,0,0,0)}else monthStart.setMonth(monthStart.getMonth()+ +d.month);render()}
 else if(d.pass){passFor=d.pass;render()}
 else if(d.note){noteOpen=d.note;notesBook=false;render()}
 else if(d.act==='egg')tapEgg(d.egg)
 else if(d.plan){planFor=d.plan;render()}
  else if(d.set&&workout){
  const c={...checkins[workout.key],rounds:{...checkins[workout.key].rounds}},was=c.rounds[d.set]
  if(was)delete c.rounds[d.set];else{c.rounds[d.set]=1;startRest(+d.rest)}
  save(c)
  if(!was&&roundsDone(c)===totalRounds(programOf(c))){hearts(28);toast('Every set done. So proud of you 🎉');sendCheer('done',{program:c.program});if(c.program==='glutes')findEgg('peach')}
 }
 else if(d.pick&&workout){const c={...checkins[workout.key]};c[d.pick]=c[d.pick]===d.id?null:d.id;save(c)}
 else if(d.step&&workout){
  if(d.step==='done'){closeWorkout();view='today';return}
  const n=programOf(checkins[workout.key]).ex.length
  workout.step=Math.max(0,Math.min(n+2,workout.step+ +d.step));rest=null;confirmRemove=false
  store.set('workout',JSON.stringify(workout));render.resetScroll=true;render()
 }
 else if(d.rest==='skip'){rest=null;drawTimer()}
 else if(d.rest==='+15'&&rest){rest.ends+=15000;rest.total+=15;drawTimer()}
 else if(d.act==='close')closeWorkout()
 else if(d.act==='remove'){if(confirmRemove)remove(workout.key);else{confirmRemove=true;render()}}

let instants=[],instantUrls={},composing=null,viewing=null,sending=false
const MAX_EDGE=1280
// a viewed instant stays visible to the sender as "Seen" for a day, then the sender's phone deletes photo and row to stay inside the free 1 GB
const KEEP_SEEN_MS=24*3600e3,KEEP_UNSEEN_MS=7*24*3600e3

// phone photos are 3–5 MB; a 1280 px JPEG is about 250 KB and still sharp on an iPhone screen
async function shrinkPhoto(file){
 const img=new Image();img.src=URL.createObjectURL(file);await img.decode()
 const scale=Math.min(1,MAX_EDGE/Math.max(img.naturalWidth,img.naturalHeight))
 const canvas=document.createElement('canvas')
 canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale)
 canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height)
 URL.revokeObjectURL(img.src)
 return new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82))
}
async function loadInstants(){
 const {data,error}=await sb.from('instants').select('*').order('sent_at',{ascending:false})
 if(error){toast('Instants didn\'t load. Pull the app closed and open it again.');return}
 instants=data
 await sweepInstants()
 const unsigned=instants.filter(i=>!instantUrls[i.id])
 if(unsigned.length){
  const {data:signed}=await sb.storage.from('instants').createSignedUrls(unsigned.map(i=>i.path),3600)
  ;(signed||[]).forEach((s,n)=>{if(s.signedUrl)instantUrls[unsigned[n].id]=s.signedUrl})
 }
 render()
}
async function sweepInstants(){
 const now=Date.now()
 const old=instants.filter(i=>i.sender===me&&(i.seen_at?now-new Date(i.seen_at)>KEEP_SEEN_MS:now-new Date(i.sent_at)>KEEP_UNSEEN_MS))
 if(!old.length)return
 await sb.storage.from('instants').remove(old.map(i=>i.path))
 await sb.from('instants').delete().in('id',old.map(i=>i.id))
 instants=instants.filter(i=>!old.includes(i))
}

// each plan's own rhythm is the weekly goal: Vicky's has five programs, Delian's three
const WEEKLY_GOAL={v:PROGRAMS.v.length,d:PROGRAMS.d.length}
function weekDates(monday){return [...Array(7)].map((_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);return iso(d)})}
const gymDays=(person,monday)=>weekDates(monday).filter(d=>checkinsOf(person,d).length).length
const trainedTogether=monday=>weekDates(monday).some(d=>checkinsOf('v',d).some(c=>checkins[`${d}_d_${c.program}`]))
// the running week only ever adds to a streak; it can't break it until the week is over
function weekStreak(hit){
 const monday=mondayOf(new Date());let weeks=hit(monday)?1:0
 for(let i=0;i<104;i++){monday.setDate(monday.getDate()-7);if(!hit(monday))break;weeks++}
 return weeks
}

     const inMonth=atNoon(d).getMonth()===monthStart.getMonth(),mineThere=checkinsOf(me,d),theirsThere=checkinsOf(mate,d)

  </section>
 </div>`

 ['avatar','Poke your favourite person','You keep tapping my face. I get it, I\'m cute. You\'re cuter.'],
 ['butterfly','Wings on chest & back day','Fun fact: you still give me these 🦋 every time you walk into the gym.'],
 ['peach','Finish every set of a 🍑 day','Glute day done 🍑 Strongest girl in Deggendorf, and I\'m not biased. Okay, a little.'],
 ['caption','Mention someone special in an instant','You wrote my name. I\'m smiling like an idiot right now.'],
 ['night','Open the app when you should be asleep','It\'s late, my love. Put the phone down and come to sleep, the dumbbells will still be there tomorrow 🌙'],
 ['pass','Your gym pass likes attention','This QR gets you into the gym. You got into my heart without one.'],
 ['rules','Read your rules really, really closely','Rule number one, not in any plan: Delian loves you. Always.']
]
// how many taps each hiding spot needs, so nobody finds one by accident
const EGG_TAPS={greeting:3,avatar:5,butterfly:3,pass:3,rules:3}
let eggsFound=JSON.parse(store.get('eggs')||'[]'),noteOpen=null,notesBook=false,eggTaps={},eggTimer=null
function tapEgg(name){
 if(me!=='v')return
 eggTaps[name]=(eggTaps[name]||0)+1
 clearTimeout(eggTimer);eggTimer=setTimeout(()=>eggTaps={},1500)
 if(eggTaps[name]>=EGG_TAPS[name]){eggTaps={};findEgg(name)}
}
function findEgg(name){
 if(me!=='v')return
 const fresh=!eggsFound.includes(name)
 if(fresh){
  eggsFound.push(name);store.set('eggs',JSON.stringify(eggsFound))
  sb?.auth.updateUser({data:{eggs:eggsFound}})
  sendCheer('egg',{count:eggsFound.length})
 }
 noteOpen=name;hearts(fresh?20:6);render()
}
function renderNote(){
 const note=noteOpen&&LOVE_NOTES.find(n=>n[0]===noteOpen)
 if(!note)return ''
 return `<div class="sheet note-bg" data-act="close-note"><div class="lovenote"><span class="bigemo">💌</span><p class="eyebrow">Love note ${LOVE_NOTES.findIndex(n=>n[0]===noteOpen)+1} · ${eggsFound.length} of ${LOVE_NOTES.length} found</p><p class="paper">${note[2]}</p><p class="sig">— D</p><button class="big solid" data-act="close-note">💗 Keep it</button></div></div>`
}
function renderNotesBook(){
 if(!notesBook)return ''
 return `<div class="sheet" data-act="book-bg"><div class="pv"><span class="grab"></span><h2 class="section">Love notes 💌 ${eggsFound.length}/${LOVE_NOTES.length}</h2>
  <div class="list">${LOVE_NOTES.map(([id,hint,text],i)=>eggsFound.includes(id)
   ?`<button class="row" data-note="${id}"><span class="wkday">💌</span><span class="grow"><b>Note ${i+1}</b><span class="muted small">${text.slice(0,48)}…</span></span><span class="chev">›</span></button>`
   :`<div class="row"><span class="wkday">🔒</span><span class="grow"><b>Note ${i+1}</b><span class="muted small">${eggsFound.length>=3?hint:'Still hidden somewhere in the app…'}</span></span></div>`).join('')}</div></div></div>`
}

let passwordSheet=false
function renderPasswordSheet(){
 if(!passwordSheet)return ''
 return `<div class="sheet"><div class="p${me}"><span class="grab"></span><h2 class="section">New password for ${NAME[me]}</h2>
  <input type="password" id="new-pass" class="field" placeholder="At least 6 characters" autocomplete="new-password">
  <button class="big solid" data-act="save-pass">Save password</button><button class="big soft" data-act="cancel-pass">Cancel</button></div></div>`
}
async function savePassword(){
 const password=$('new-pass').value
 if(password.length<6){toast('That one\'s too short: use at least 6 characters.');return}
 const {error}=await sb.auth.updateUser({password})
 if(error){toast('Password not changed: '+error.message);return}
 passwordSheet=false;toast('New password saved 🔐');render()
}

let load=null,chooseLogin=()=>{}
;(()=>{
 const C=window.MG_CONFIG||{},gate=$('gate')
 const saved=store.get('workout');if(saved)try{workout=JSON.parse(saved)}catch(e){}
 if(!window.supabase||!C.url||/YOUR_/.test(C.url+C.anonKey)){syncNote='Sync is off: add the Supabase keys to config.js.';gate.hidden=!!me;render();return}
 sb=window.supabase.createClient(C.url,C.anonKey,{auth:{persistSession:true,autoRefreshToken:true}})
 let channel=null
 load=async()=>{
  const {data,error}=await sb.from('checkins').select('*')
  if(error){syncNote='Couldn\'t load your check-ins. Close and reopen the app to try again.';render();return}
  checkins={};data.forEach(r=>{checkins[r.key]={...r,date:String(r.date).slice(0,10)}});syncNote='';render()
  const {data:stations}=await sb.from('radio').select('*')
  ;(stations||[]).forEach(r=>{if(r.person!==me)listening[r.person]=r});render()
  loadInstants();loadPasses()
 }
 const listen=()=>{if(channel)return;channel=sb.channel('checkins-live').on('postgres_changes',{event:'*',schema:'public',table:'checkins'},p=>{
  if(p.eventType==='DELETE'){delete checkins[p.old.key];if(workout?.key===p.old.key)closeWorkout()}else checkins[p.new.key]={...p.new,date:String(p.new.date).slice(0,10)};render()})
  .on('postgres_changes',{event:'*',schema:'public',table:'radio'},p=>{if(p.new?.person&&p.new.person!==me){listening[p.new.person]=p.new;render()}})
  .on('postgres_changes',{event:'*',schema:'public',table:'instants'},p=>{if(p.eventType==='INSERT'&&p.new.sender!==me)toast(`${NAME[p.new.sender]} sent you an instant 📸`);loadInstants()})
  .subscribe()
  cheers=sb.channel('couple-cheers',{config:{broadcast:{self:false}}}).on('broadcast',{event:'cheer'},({payload})=>receiveCheer(payload)).subscribe()}
 // the account itself says whose phone this is, so there is nothing to choose after signing in
 async function start(session){
  gate.hidden=!!session
  if(!session)return
  me=session.user.user_metadata?.who||me;store.set('who',me)
  eggsFound=[...new Set([...eggsFound,...(session.user.user_metadata?.eggs||[])])]
  await load();listen()
 }
 sb.auth.getSession().then(({data})=>start(data.session))
 sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')start(session)})
 let loginAs=null
 chooseLogin=who=>{loginAs=who;$('gate-form').className='p'+who;document.querySelectorAll('[data-login]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.login===who));$('gate-pass').hidden=$('gate-btn').hidden=false;$('gate-pass').placeholder=`${NAME[who]}'s password`;$('gate-err').hidden=true;$('gate-pass').focus()}
 $('gate-form').addEventListener('submit',async e=>{
  e.preventDefault();const err=$('gate-err'),btn=$('gate-btn'),password=$('gate-pass').value;err.hidden=true
  if(!loginAs){err.textContent='Tap your name first.';err.hidden=false;return}
  btn.disabled=true
  // the emails stay out of the public code: the database hands back the right one for the name that was tapped
  const {data:email,error:lookup}=await sb.rpc('login_email',{who:loginAs})
  const {error}=lookup||!email?{error:lookup||{}}:await sb.auth.signInWithPassword({email,password})
  btn.disabled=false
  if(lookup)err.textContent='Can\'t reach the server. Check your internet and try again.'
  else if(error)err.textContent=`That's not ${NAME[loginAs]}'s password. It's case-sensitive, try again.`
  err.hidden=!error&&!lookup
 })
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})
})()
</script>
</body>
